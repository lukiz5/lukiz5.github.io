name: Fetch SENNS Dashboard Data

on:
  schedule:
    - cron: '15 5,8,11,14,17,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dateutil google-auth

      - name: Fetch dashboard data
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_INSTAGRAM_ID: ${{ secrets.META_INSTAGRAM_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit updated dashboard data
        run: |
          if git diff --quiet -- data/senns_data.json; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tmp_json="$(mktemp)"
          trap 'rm -f "$tmp_json"' EXIT
          cp data/senns_data.json "$tmp_json"

          # Rebase against the latest main without carrying the generated JSON
          # as a local worktree change.
          git restore --staged --worktree data/senns_data.json
          git fetch origin main
          git pull --rebase origin main

          cp "$tmp_json" data/senns_data.json
          git add data/senns_data.json

          if git diff --cached --quiet -- data/senns_data.json; then
            echo "No data changes to commit after rebase."
            exit 0
          fi

          git commit -m "Update SENNS dashboard data"
          git push origin HEAD:main
